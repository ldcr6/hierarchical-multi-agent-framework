[project]
name = "hmas"
version = "0.1.0"
description = "Hierarchical multi-agent framework with dynamic task decomposition and adaptive verification"
requires-python = ">=3.10"
dependencies = ["openai>=1.30", "pyyaml>=6", "langgraph>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hmas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
